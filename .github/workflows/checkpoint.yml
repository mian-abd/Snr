name: Checkpoint 1 verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend ruff check backend/app backend/tests
      - run: uv run --project backend mypy backend/app
      - run: uv run --project backend pytest backend/tests -q
      - run: uv run --project backend python backend/scripts/export_openapi.py
      - run: git diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx openapi-typescript openapi.json -o src/api/schema.d.ts
        working-directory: frontend
      - run: git diff --exit-code src/api/schema.d.ts
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
